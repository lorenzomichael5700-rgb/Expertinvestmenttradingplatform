<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Create Account</h2>

  </div>
  <script src="script.js"></script>
</body>
</html>
